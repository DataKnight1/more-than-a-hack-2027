# N014 — N013 + football-aware extensions (D-018): pitch control (feature version 4), graph-relational spatial attention (edge bias), latent-ball auxiliary head. N013 = N012 with seed 20261109 (D-017 champion). N012 = N011 + possession-change head. N011 = N010 seed 2 (features v3). N008 = N007 + seed 2; N007 = N006 + EDA data engineering: low-detection frames (<4 tracked objects) masked from the loss, and Metrica sample
# data added (game 1 train, game 2 val, game 3 test; D-010). Otherwise as N006, same data and frozen splits, trained on IDSSE/DFL (CC BY 4.0) + SkillCorner open data (MIT).
# SkillCorner split frozen 2026-11-06 before any model saw it: sorted match ids, index%4==3 -> test,
# index%8==1 -> val, rest train. IDSSE split identical to N001. External data only.

[experiment]
name = "n014_football_aware"
seed = 20261109
hypothesis = """Football-aware extensions of N013 (literature review, Tiago 2026-11-07): probabilistic pitch control
(Spearman 2018 time-to-intercept, published constants), graph-relational attention over ball/player pairs, and a latent-ball
head trained on the clean source ball under augmentation-hidden frames (Kim et al. 2023) improve spellF1, mainly under
degraded ball tracking (N013 clean 0.733 vs degraded 0.578)."""

[data]
canonical_dir = "data/external/canonical"
train = ["idsse_J03WMX", "idsse_J03WOH", "idsse_J03WOY", "idsse_J03WPY",
         "skillcorner_1874553", "skillcorner_1899585", "skillcorner_1927964", "skillcorner_1953632",
         "skillcorner_1959846", "skillcorner_1996435", "skillcorner_2006229", "skillcorner_2007448",
         "skillcorner_2007721", "skillcorner_2010085", "skillcorner_2013725", "skillcorner_2016236", "metrica_1"]
val = ["idsse_J03WQQ", "skillcorner_1886347", "skillcorner_1996436", "skillcorner_2015213", "metrica_2"]
test = ["idsse_J03WN1", "idsse_J03WR9",
        "skillcorner_1925299", "skillcorner_1986691", "skillcorner_2006363", "skillcorner_2011166",
        "skillcorner_2017461", "metrica_3"]
degrade_eval_seed = 7

[model]
d_model = 192
spatial_layers = 3
temporal_layers = 6
heads = 6
ff_mult = 4
dropout = 0.1
transition_head = true
edge_bias = true
edge_hidden = 16
ball_head = true

[train]
window = 384
batch_size = 8
accum = 2
max_players = 30
steps = 16000
lr = 4e-4
weight_decay = 0.05
warmup = 300
grad_clip = 1.0
clean_prob = 0.25
num_workers = 3
feature_version = 4
min_players_label = 4
eval_every = 2000
eval_stride = 192
transition_weight = 1.0
transition_radius = 2
ball_weight = 0.5
ball_visible_weight = 0.2

[decode]
team_switch = 8.0
dead_switch = 4.0
