# Three-state Viterbi possession decoder (src/possession_lab/hmm.py).
# Values are physical priors set before any scoring. Never tune them on the public 5 minutes.
[experiment]
name = "possession-hmm"
seed = 42

[model]
family = "possession_hmm"
apply_ungraded_x = true

[hmm]
control_m = 1.5
contrast_m = 1.5
flight_mps = 15.0
alive_share = 0.5
slow_weight = 0.35
out_weight = 2.0
gap_weight = 0.2
gap_s = 1.0
rolling_weight = 0.4
team_switch_s = 0.6
dead_switch_s = 1.0
